<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lỗi - Hệ thống Tư vấn Học thuật</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="text-center">
        <div class="mb-4">
            <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
        </div>
        <h1 class="mb-3">
            <i class="bi bi-x-circle me-2"></i>Đã xảy ra lỗi
        </h1>
        <div class="alert alert-danger" role="alert">
            <h5 class="mb-2">Mã lỗi: <span class="badge bg-danger" th:text="${status}">500</span></h5>
            <p class="mb-0" th:text="${message}">Lỗi hệ thống</p>
        </div>
        <div class="mt-5">
            <a th:href="@{/dashboard}" class="btn btn-primary btn-lg">
                <i class="bi bi-arrow-left me-2"></i>Quay lại Dashboard
            </a>
            <a th:href="@{/}" class="btn btn-outline-secondary btn-lg ms-2">
                <i class="bi bi-house me-2"></i>Trang chủ
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

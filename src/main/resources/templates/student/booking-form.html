<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lịch tư vấn - Hệ thống Tư vấn Học thuật</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-info text-white">
                    <h2 class="mb-0">
                        <i class="bi bi-calendar-plus me-2"></i>Đặt lịch tư vấn
                    </h2>
                </div>

                <div class="card-body py-4">
                    <form th:action="@{/student/booking}" th:object="${bookingForm}" method="post">
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-circle me-2"></i>
                            <div th:each="err : ${#fields.globalErrors()}">
                                <span th:text="${err}"></span>
                            </div>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <div class="mb-3">
                            <label for="departmentSelect" class="form-label">
                                <i class="bi bi-building me-1"></i>Khoa/Ngành
                            </label>
                            <select class="form-select" name="departmentId" id="departmentSelect" onchange="window.location.href='/student/booking?departmentId=' + this.value">
                                <option value="">-- Chọn khoa/ngành --</option>
                                <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}" th:selected="${selectedDepartmentId != null and selectedDepartmentId == dept.id}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="lecturerId" class="form-label">
                                <i class="bi bi-person-workspace me-1"></i>Giảng viên
                            </label>
                            <select class="form-select" th:field="*{lecturerId}" id="lecturerId">
                                <option value="">-- Chọn giảng viên --</option>
                                <option th:each="lec : ${lecturers}" th:value="${lec.id}" th:text="${lec.fullName + ' (' + lec.departmentName + ')' }"></option>
                            </select>
                            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('lecturerId')}" th:errors="*{lecturerId}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="sessionDate" class="form-label">
                                <i class="bi bi-calendar me-1"></i>Ngày
                            </label>
                            <input type="date" class="form-control" th:field="*{sessionDate}" id="sessionDate" />
                            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('sessionDate')}" th:errors="*{sessionDate}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="sessionTime" class="form-label">
                                <i class="bi bi-clock me-1"></i>Giờ
                            </label>
                            <input type="time" class="form-control" th:field="*{sessionTime}" id="sessionTime" />
                            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('sessionTime')}" th:errors="*{sessionTime}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-info text-white">
                                <i class="bi bi-check-circle me-2"></i>Đặt lịch
                            </button>
                            <a th:href="@{/student/history}" class="btn btn-secondary">
                                <i class="bi bi-clock-history me-2"></i>Xem lịch sử
                            </a>
                            <a th:href="@{/dashboard}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-2"></i>Dashboard
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Trang sinh vien</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
	<link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
	<div class="welcome-section mb-4">
		<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
			<div>
				<h1 class="mb-1">
					<i class="bi bi-person-graduate me-2"></i>Xin chao,
					<strong th:text="${currentUser.profile != null ? currentUser.profile.fullName : currentUser.username}"></strong>
				</h1>
				<p class="mb-0">Chuc nang danh rieng cho sinh vien</p>
			</div>
			<form th:action="@{/logout}" method="post">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				<button type="submit" class="btn btn-outline-light">
					<i class="bi bi-box-arrow-right me-2"></i>Dang xuat
				</button>
			</form>
		</div>
	</div>

	<div class="row g-3">
		<div class="col-md-6 col-lg-4">
			<a th:href="@{/student/booking}" class="dashboard-card text-decoration-none">
				<div class="dashboard-card-icon text-primary"><i class="bi bi-calendar-check"></i></div>
				<div class="dashboard-card-title">Dat lich tu van</div>
				<div class="dashboard-card-desc">Dat lich hen voi giang vien</div>
			</a>
		</div>
		<div class="col-md-6 col-lg-4">
			<a th:href="@{/student/history}" class="dashboard-card text-decoration-none">
				<div class="dashboard-card-icon text-info"><i class="bi bi-clock-history"></i></div>
				<div class="dashboard-card-title">Lich su tu van</div>
				<div class="dashboard-card-desc">Xem lich su va trang thai buoi hen</div>
			</a>
		</div>
		<div class="col-md-6 col-lg-4">
			<a th:href="@{/profile}" class="dashboard-card text-decoration-none">
				<div class="dashboard-card-icon text-secondary"><i class="bi bi-person"></i></div>
				<div class="dashboard-card-title">Ho so ca nhan</div>
				<div class="dashboard-card-desc">Xem va cap nhat thong tin</div>
			</a>
		</div>
	</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

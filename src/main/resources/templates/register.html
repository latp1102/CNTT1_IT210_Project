<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
</head>
<body>
<h1>Đăng ký sinh viên</h1>
<form th:action="@{/register}" th:object="${registrationForm}" method="post">
    <div th:if="${#fields.hasGlobalErrors()}">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err.defaultMessage}"></p>
    </div>
    <div>
        <label>Tên đăng nhập</label>
        <input type="text" th:field="*{username}"/>
        <div style="color:red" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
    </div>
    <div>
        <label>Mật khẩu</label>
        <input type="password" th:field="*{password}"/>
        <div style="color:red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>
    <div>
        <label>Xác nhận mật khẩu</label>
        <input type="password" th:field="*{confirmPassword}"/>
        <div style="color:red" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
    </div>
    <div>
        <label>Họ tên</label>
        <input type="text" th:field="*{fullName}"/>
        <div style="color:red" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
    </div>
    <div>
        <label>Email</label>
        <input type="email" th:field="*{email}"/>
        <div style="color:red" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>
    <div>
        <label>Số điện thoại</label>
        <input type="text" th:field="*{phone}"/>
        <div style="color:red" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
    </div>
    <div>
        <label>Khoa/Ngành</label>
        <select th:field="*{departmentId}">
            <option value="">-- Chọn --</option>
            <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
        </select>
    </div>
    <input type="hidden" th:field="*{role}"/>
    <button type="submit">Đăng ký</button>
</form>
<p><a th:href="@{/login}">Quay lại đăng nhập</a></p>
</body>
</html>

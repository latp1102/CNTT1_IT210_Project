<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Hệ thống Tư vấn Học thuật</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }
        .register-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 35px;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }
        .register-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .register-header h1 {
            font-size: 26px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        .register-header p {
            color: #999;
            font-size: 13px;
        }
        .form-control, .form-select {
            border-radius: 6px;
            border: 1px solid #ddd;
            padding: 10px 12px;
            font-size: 14px;
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .form-label {
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .mb-3 {
            margin-bottom: 14px !important;
        }
        button[type="submit"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            border: none !important;
            padding: 11px 20px !important;
            font-weight: 600 !important;
            color: white !important;
            border-radius: 6px !important;
            cursor: pointer !important;
            width: 100% !important;
            transition: all 0.3s ease !important;
            font-size: 15px !important;
            display: block !important;
            margin: 20px 0 15px 0 !important;
        }
        button[type="submit"]:hover {
            background: linear-gradient(135deg, #5568d3 0%, #6a3f91 100%) !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4) !important;
        }
        .alert {
            font-size: 13px;
            padding: 10px 12px;
            margin-bottom: 15px;
        }
        .text-danger {
            font-size: 0.8rem;
            color: #dc3545;
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="register-header">
        <h1><i class="bi bi-person-plus me-2"></i>Đăng ký</h1>
        <p>Tạo tài khoản sinh viên mới</p>
    </div>

    <form th:action="@{/register}" th:object="${registrationForm}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle me-2"></i>
            <div th:each="err : ${#fields.globalErrors()}">
                <span th:text="${err.defaultMessage}"></span>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="mb-3">
            <label for="username" class="form-label">
                <i class="bi bi-person me-1"></i>Tên đăng nhập
            </label>
            <input type="text" class="form-control" th:field="*{username}" id="username" placeholder="Nhập tên đăng nhập (3-50 ký tự)" />
            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">
                <i class="bi bi-lock me-1"></i>Mật khẩu
            </label>
            <input type="password" class="form-control" th:field="*{password}" id="password" placeholder="Nhập mật khẩu (8-100 ký tự)" />
            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">
                <i class="bi bi-lock me-1"></i>Xác nhận mật khẩu
            </label>
            <input type="password" class="form-control" th:field="*{confirmPassword}" id="confirmPassword" placeholder="Xác nhận mật khẩu" />
            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>

        <div class="mb-3">
            <label for="fullName" class="form-label">
                <i class="bi bi-person-badge me-1"></i>Họ tên
            </label>
            <input type="text" class="form-control" th:field="*{fullName}" id="fullName" placeholder="Nhập họ và tên" />
            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">
                <i class="bi bi-envelope me-1"></i>Email
            </label>
            <input type="email" class="form-control" th:field="*{email}" id="email" placeholder="Nhập địa chỉ email" />
            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">
                <i class="bi bi-telephone me-1"></i>Số điện thoại
            </label>
            <input type="text" class="form-control" th:field="*{phone}" id="phone" placeholder="Nhập số điện thoại" />
            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <div class="mb-3">
            <label for="departmentId" class="form-label">
                <i class="bi bi-building me-1"></i>Khoa/Ngành
            </label>
            <select class="form-select" th:field="*{departmentId}" id="departmentId">
                <option value="">-- Chọn Khoa/Ngành --</option>
                <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
            </select>
            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></div>
        </div>

        <input type="hidden" th:field="*{role}"/>

        <button type="submit" class="btn btn-register w-100 text-white mb-3">
            <i class="bi bi-person-plus me-2"></i>Đăng ký
        </button>
    </form>

    <div class="text-center">
        <p class="mb-0">Đã có tài khoản? <a th:href="@{/login}" class="text-decoration-none">Đăng nhập ngay</a></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thiết bị - Hệ thống Tư vấn Học thuật</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">
            <i class="bi bi-tools me-2"></i>Quản lý thiết bị
        </h1>
        <a th:href="@{/admin/equipments/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-2"></i>Thêm thiết bị
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th><i class="bi bi-hash me-2"></i>ID</th>
                        <th><i class="bi bi-box me-2"></i>Tên thiết bị</th>
                        <th><i class="bi bi-stack me-2"></i>Số lượng</th>
                        <th><i class="bi bi-file-text me-2"></i>Mô tả</th>
                        <th class="text-center"><i class="bi bi-gear me-2"></i>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="equipment : ${equipments}">
                        <td><span class="badge bg-secondary" th:text="${equipment.id}"></span></td>
                        <td><strong th:text="${equipment.name}"></strong></td>
                        <td>
                            <span class="badge bg-info" th:text="${equipment.quantity}"></span>
                        </td>
                        <td th:text="${equipment.description}"></td>
                        <td class="text-center">
                            <a th:href="@{'/admin/equipments/' + ${equipment.id} + '/edit'}" class="btn btn-sm btn-warning">
                                <i class="bi bi-pencil me-1"></i>Sửa
                            </a>
                            <form th:action="@{'/admin/equipments/' + ${equipment.id} + '/delete'}" method="post" style="display:inline" onsubmit="return confirm('Bạn có chắc muốn xóa?')">
                                <button type="submit" class="btn btn-sm btn-danger">
                                    <i class="bi bi-trash me-1"></i>Xóa
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/admin/home}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>Trang admin
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

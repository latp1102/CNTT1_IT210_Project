<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formTitle} + ' - Hệ thống Tư vấn Học thuật'">Thiết bị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row g-2 mb-4">
        <div class="col-auto">
            <a th:href="@{/admin/equipments}" class="btn btn-outline-primary">
                <i class="bi bi-tools me-2"></i>Thiết bị
            </a>
        </div>
        <div class="col-auto">
            <a th:href="@{/admin/equipments/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>Thêm thiết bị
            </a>
        </div>
        <div class="col-auto">
            <a th:href="@{/admin/inventory}" class="btn btn-info text-white">
                <i class="bi bi-box-seam me-2"></i>Xuất kho
            </a>
        </div>
        <div class="col-auto">
            <a th:href="@{/admin/home}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Trang admin
            </a>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">
                        <i class="bi bi-box me-2"></i><span th:text="${formTitle}"></span>
                    </h2>
                </div>

                <div class="card-body py-4">
                    <form th:action="${actionUrl}" th:object="${equipmentForm}" method="post">
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-circle me-2"></i>
                            <div th:each="err : ${#fields.globalErrors()}">
                                <span th:text="${err}"></span>
                            </div>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label">
                                <i class="bi bi-box me-1"></i>Tên thiết bị
                            </label>
                            <input type="text" class="form-control" th:field="*{name}" id="name" placeholder="Nhập tên thiết bị" />
                            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="quantity" class="form-label">
                                <i class="bi bi-stack me-1"></i>Số lượng
                            </label>
                            <input type="number" class="form-control" th:field="*{quantity}" id="quantity" min="0" placeholder="Nhập số lượng" />
                            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label">
                                <i class="bi bi-file-text me-1"></i>Mô tả
                            </label>
                            <textarea class="form-control" th:field="*{description}" id="description" rows="4" placeholder="Nhập mô tả về thiết bị"></textarea>
                            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-2"></i>Lưu
                            </button>
                            <a th:href="@{/admin/equipments}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-2"></i>Quay lại
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Thiết bị</title>
</head>
<body>
<h1 th:text="${formTitle}"></h1>
<form th:action="${actionUrl}" th:object="${equipmentForm}" method="post">
    <div th:if="${#fields.hasGlobalErrors()}">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
    </div>
    <div><label>Tên</label><input type="text" th:field="*{name}"/></div>
    <div><label>Số lượng</label><input type="number" th:field="*{quantity}" min="0"/></div>
    <div><label>Mô tả</label><textarea th:field="*{description}"></textarea></div>
    <button type="submit">Lưu</button>
</form>
<p><a th:href="@{/admin/equipments}">Quay lại</a></p>
</body>
</html>

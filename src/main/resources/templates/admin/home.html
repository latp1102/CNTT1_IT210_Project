<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang quan tri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="welcome-section mb-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div>
                <h1 class="mb-1">
                    <i class="bi bi-house me-2"></i>Xin chao,
                    <strong th:text="${currentUser.profile != null ? currentUser.profile.fullName : currentUser.username}"></strong>
                </h1>
                <p class="mb-0">Trang chuc nang rieng cho quan tri vien</p>
            </div>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-outline-light">
                    <i class="bi bi-box-arrow-right me-2"></i>Dang xuat
                </button>
            </form>
        </div>
    </div>

    <h3 class="mb-4"><i class="bi bi-gear me-2"></i>Quan ly he thong</h3>
    <div class="row g-3">
        <div class="col-md-6 col-lg-4">
            <a th:href="@{/admin/equipments}" class="dashboard-card text-decoration-none">
                <div class="dashboard-card-icon text-warning"><i class="bi bi-tools"></i></div>
                <div class="dashboard-card-title">Quan ly thiet bi</div>
                <div class="dashboard-card-desc">Them, sua, xoa thiet bi</div>
            </a>
        </div>
        <div class="col-md-6 col-lg-4">
            <a th:href="@{/admin/inventory}" class="dashboard-card text-decoration-none">
                <div class="dashboard-card-icon text-danger"><i class="bi bi-box-seam"></i></div>
                <div class="dashboard-card-title">Xuat kho</div>
                <div class="dashboard-card-desc">Xac nhan cap phat thiet bi</div>
            </a>
        </div>
        <div class="col-md-6 col-lg-4">
            <a th:href="@{/admin/statistics}" class="dashboard-card text-decoration-none">
                <div class="dashboard-card-icon text-info"><i class="bi bi-bar-chart"></i></div>
                <div class="dashboard-card-title">Thong ke bao cao</div>
                <div class="dashboard-card-desc">Tong hop du lieu he thong</div>
            </a>
        </div>
        <div class="col-md-6 col-lg-4">
            <a th:href="@{/profile}" class="dashboard-card text-decoration-none">
                <div class="dashboard-card-icon text-secondary"><i class="bi bi-person"></i></div>
                <div class="dashboard-card-title">Ho so ca nhan</div>
                <div class="dashboard-card-desc">Xem va cap nhat thong tin</div>
            </a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

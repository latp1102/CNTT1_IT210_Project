<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xuất kho - Hệ thống Tư vấn Học thuật</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row g-2 mb-4">
        <div class="col-auto">
            <a th:href="@{/admin/equipments}" class="btn btn-outline-primary">
                <i class="bi bi-tools me-2"></i>Thiết bị
            </a>
        </div>
        <div class="col-auto">
            <a th:href="@{/admin/equipments/new}" class="btn btn-success">
                <i class="bi bi-plus-circle me-2"></i>Thêm thiết bị
            </a>
        </div>
        <div class="col-auto">
            <a th:href="@{/admin/inventory}" class="btn btn-primary">
                <i class="bi bi-box-seam me-2"></i>Xuất kho
            </a>
        </div>
        <div class="col-auto">
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Dashboard
            </a>
        </div>
    </div>

    <h1 class="mb-4">
        <i class="bi bi-box-seam me-2"></i>Phiếu chờ cấp phát
    </h1>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${#lists.isEmpty(records)}" class="alert alert-info">
        <i class="bi bi-info-circle me-2"></i>
        Không có phiếu nào chờ xác nhận.
    </div>

    <div th:each="record : ${records}" class="card shadow-sm mb-4">
        <div class="card-header bg-light border-bottom">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h5 class="mb-0">
                        <span class="badge bg-secondary" th:text="'Phiếu #' + ${record.id}"></span>
                        <i class="bi bi-calendar-event me-2"></i>
                        <span th:text="${record.session != null ? record.session.sessionTime : 'N/A'}"></span>
                    </h5>
                </div>
                <div class="col-md-6 text-end">
                    <strong class="me-2">Sinh viên:</strong>
                    <span th:text="${record.session != null && record.session.student != null && record.session.student.profile != null ? record.session.student.profile.fullName : 'N/A'}"></span>
                </div>
            </div>
        </div>

        <div class="card-body">
            <h6 class="text-muted mb-3">
                <i class="bi bi-box me-2"></i>Thiết bị cần cấp phát:
            </h6>

            <div th:if="${#lists.isEmpty(record.details)}" class="text-muted ms-3">
                Không có thiết bị trong phiếu này
            </div>

            <table class="table table-sm" th:unless="${#lists.isEmpty(record.details)}">
                <thead class="table-light">
                    <tr>
                        <th><i class="bi bi-box me-1"></i>Tên thiết bị</th>
                        <th class="text-center"><i class="bi bi-stack me-1"></i>Số lượng</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="detail : ${record.details}">
                        <td th:text="${detail.equipment != null ? detail.equipment.name : 'N/A'}"></td>
                        <td class="text-center">
                            <span class="badge bg-info" th:text="${detail.quantity}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="mt-3">
                <form th:action="@{'/admin/inventory/' + ${record.id} + '/confirm'}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-success" onclick="return confirm('Xác nhận cấp phát thiết bị?')">
                        <i class="bi bi-check-circle me-2"></i>Xác nhận xuất kho
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>Về dashboard
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

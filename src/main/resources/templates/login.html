<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
</head>
<body>
<h1>Đăng nhập</h1>
<p th:if="${param.logout}">Bạn đã đăng xuất</p>
<p th:if="${success}" th:text="${success}"></p>

<form th:action="@{/login}" th:object="${loginForm}" method="post">
    <div th:if="${#fields.hasGlobalErrors()}">
        <p style="color:red" th:each="err : ${#fields.globalErrors()}" th:text="${err.defaultMessage}"></p>
    </div>

    <div>
        <label for="username">Tên đăng nhập</label>
        <input type="text" th:field="*{username}" id="username" />
        <div style="color:red" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
    </div>

    <div>
        <label for="password">Mật khẩu</label>
        <input type="password" th:field="*{password}" id="password" />
        <div style="color:red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <button type="submit">Đăng nhập</button>
</form>

<p><a th:href="@{/register}">Tạo tài khoản sinh viên</a></p>
</body>
</html>

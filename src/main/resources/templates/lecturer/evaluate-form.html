<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đánh giá tư vấn</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h2>Đánh giá ca tư vấn</h2>

      <div class="mb-3">
        <strong>Sinh viên:</strong>
        <span th:text="${sessionStudentName}"></span>
      </div>

      <div class="mb-3">
        <strong>Thời gian:</strong>
        <span th:text="${sessionTimeDisplay}"></span>
      </div>

      <form
        method="post"
        th:action="@{/lecturer/sessions/{id}/evaluate(id=${evaluationForm.sessionId})}"
        th:object="${evaluationForm}"
      >
        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        />
        <input type="hidden" th:field="*{sessionId}" />

        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
          <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
        </div>

        <div class="mb-3">
          <label for="evaluationText" class="form-label">Nhận xét</label>
          <textarea
            class="form-control"
            th:field="*{evaluationText}"
            id="evaluationText"
            rows="5"
          ></textarea>
          <div th:if="${#fields.hasErrors('evaluationText')}" class="invalid-feedback d-block" th:errors="*{evaluationText}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Thiết bị 1</label>
          <select class="form-select mb-2" name="selections[0].equipmentId">
            <option value="">-- Chọn --</option>
            <option
              th:each="equipment : ${equipments}"
              th:value="${equipment.id}"
              th:text="${equipment.name}"
            ></option>
          </select>
          <input
            type="number"
            class="form-control"
            placeholder="Số lượng"
            name="selections[0].quantity"
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Thiết bị 2</label>
          <select class="form-select mb-2" name="selections[1].equipmentId">
            <option value="">-- Chọn --</option>
            <option
              th:each="equipment : ${equipments}"
              th:value="${equipment.id}"
              th:text="${equipment.name}"
            ></option>
          </select>
          <input
            type="number"
            class="form-control"
            placeholder="Số lượng"
            name="selections[1].quantity"
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Thiết bị 3</label>
          <select class="form-select mb-2" name="selections[2].equipmentId">
            <option value="">-- Chọn --</option>
            <option
              th:each="equipment : ${equipments}"
              th:value="${equipment.id}"
              th:text="${equipment.name}"
            ></option>
          </select>
          <input
            type="number"
            class="form-control"
            placeholder="Số lượng"
            name="selections[2].quantity"
          />
        </div>

        <button type="submit" class="btn btn-success">Lưu đánh giá</button>
        <a th:href="@{/lecturer/sessions}" class="btn btn-secondary"
          >Quay lại</a
        >
      </form>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách chờ tư vấn - Hệ thống Tư vấn Học thuật</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <h1 class="mb-4">
        <i class="bi bi-people me-2"></i>Danh sách sinh viên chờ tư vấn
    </h1>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th><i class="bi bi-hash me-2"></i>ID</th>
                        <th><i class="bi bi-person me-2"></i>Sinh viên</th>
                        <th><i class="bi bi-person-circle me-2"></i>Username</th>
                        <th><i class="bi bi-calendar-event me-2"></i>Thời gian</th>
                        <th class="text-center"><i class="bi bi-gear me-2"></i>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(sessions)}">
                        <td colspan="5" class="text-center text-muted py-4">
                            <i class="bi bi-inbox me-2"></i>Không có lịch chờ duyệt
                        </td>
                    </tr>
                    <tr th:each="pending : ${sessions}">
                        <td>
                            <span class="badge bg-secondary" th:text="${pending.sessionId}"></span>
                        </td>
                        <td>
                            <strong th:text="${pending.studentName}"></strong>
                        </td>
                        <td th:text="${pending.studentUsername}"></td>
                        <td>
                            <i class="bi bi-calendar me-1"></i>
                            <span th:text="${#temporals.format(pending.sessionTime, 'dd-MM-yyyy HH:mm')}"></span>
                        </td>
                        <td class="text-center">
                            <form th:action="@{/lecturer/sessions/{id}/confirm(id=${pending.sessionId})}" method="post" style="display:inline-block">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn btn-sm btn-success"><i class="bi bi-check-lg me-1"></i>Duyệt</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/lecturer/sessions/confirmed}" class="btn btn-outline-primary">Xem lịch đã duyệt</a>
    </div>

    <div class="mt-4">
        <a th:href="@{/lecturer/home}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>Trang giang vien
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
